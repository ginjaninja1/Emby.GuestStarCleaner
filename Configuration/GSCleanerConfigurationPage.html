<div data-role="page" style="align-items: center; margin: auto;" class="type-interior pluginConfigurationPage withTabs libraryFileOrganizerLogPage" data-require="emby-button,emby-input,emby-select,emby-toggle,emby-collapse" data-controller="__plugin/GSCleanerConfigurationPageJS">
	<div class="content-primary">
		<div class="verticalSection verticalSection">
			<div class="sectionTitleContainer sectionTitleContainer-cards align-items-center">
				<br />
				<h2>Removes guest stars from episodes if present at the series level</h2>

				<!--<h4>URL Link if required</h4>
		<a is="emby-linkbutton" class="button-link" href="https://mediaarea.net/en/MediaInfo/Download" target="_blank"></a>-->
			</div>

			<h3 style="color: var(--theme-accent-text-color); font-weight: bolder">Suggestion: Add a task trigger in section: GinjaNinja Tools</h3>

			<div style="margin-top: 2em;">
				<h3 class="checkboxListLabel">Enable GuestStar Cleaner</h3>
				<label class="checkboxContainer">
					<input is="emby-toggle" type="checkbox" class="chkEnableGSCleaner" />
					<span class="toggleButtonLabel mdl-switch__label">Global Option to Enable Plugin</span>
				</label>
				<div class="fieldDescription">This saves having to remove the plugin if you wish to disable it</div>
				<h3 class="checkboxListLabel">Enable TestMode</h3>
				<label class="checkboxContainer">
					<input is="emby-toggle" type="checkbox" class="chkenableGSTestmode" />
					<span class="toggleButtonLabel mdl-switch__label">TestMode logs but does not action duplicates</span>
				</label>
				<div class="fieldDescription">Safer during initial testing</div>
			</div>
            <br />
			</div>

			
	</div>
</div>
